    <rect x="40" y="120" width="64" height="24" rx="4" fill="#050505" opacity="0.9"/>
    <rect x="56" y="176" width="56" height="24" rx="4" fill="#050505" opacity="0.9"/>
    <rect x="64" y="232" width="52" height="24" rx="4" fill="#050505" opacity="0.9"/>
