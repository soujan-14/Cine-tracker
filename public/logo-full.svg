    <rect x="80" y="344" width="44" height="24" rx="4" fill="#050505" opacity="0.9"/>
    <polygon points="180,152 324,256 180,360" fill="url(#redGrad2)" filter="url(#glow)"/>
    <polygon points="188,168 308,256 188,344" fill="#ff2a2a" opacity="0.3"/>
    <g opacity="0.9">
