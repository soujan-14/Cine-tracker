<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080808;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121212;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff3838;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#ff1a1a;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#E50914;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#c80812;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b050c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.45" />
      <stop offset="20%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="40%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4a4a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ff1a1a;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#E50914;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a7060e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E50914;stop-opacity:0.98" />
      <stop offset="45%" style="stop-color:#E50914;stop-opacity:0.55" />
      <stop offset="100%" style="stop-color:#E50914;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a0000;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#0a0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050505;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="notchGrad" cx="0%" cy="50%" r="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="65%" style="stop-color:#050000;stop-opacity:0.98" />
      <stop offset="100%" style="stop-color:#1a0000;stop-opacity:0.85" />
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="playGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="edgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2" result="offsetblur"/>
      <feFlood flood-color="#5c0309" flood-opacity="0.9"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bgGrad)"/>
  <g filter="url(#shadow)" transform="translate(44, 44) scale(0.825)">
